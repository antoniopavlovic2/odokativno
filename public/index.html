<!DOCTYPE html>
<html lang="hr">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <meta name="theme-color" content="#F8F6ED" />

    <title>Otprilike – Besplatni dnevni kviz procjenjivanja</title>

    <meta
      name="description"
      content="Zaigraj Otprilike, besplatni dnevni kviz na hrvatskom jeziku. Sedam pitanja, 20 sekundi po pitanju. Testiraj svoj osjećaj za brojke!"
    />

    <meta name="robots" content="index, follow" />

    <!-- Open Graph -->

    <meta property="og:type" content="website" />
    <meta property="og:locale" content="hr_HR" />
    <meta property="og:site_name" content="Otprilike" />

    <meta property="og:title" content="OTPRILIKE. – Nemaš pojma? Nema veze." />

    <meta
      property="og:description"
      content="7 pitanja. 20 sekundi po pitanju. Koliko dobro procjenjuješ? Zaigraj besplatno!"
    />

    <meta property="og:url" content="https://otprilikehr.netlify.app/" />

    <meta
      property="og:image"
      content="https://otprilikehr.netlify.app/og-image-2.png"
    />

    <meta
      property="og:image:secure_url"
      content="https://otprilikehr.netlify.app/og-image-2.png"
    />

    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />

    <meta
      property="og:image:alt"
      content="Otprilike – logo dnevnog kviza procjenjivanja"
    />

    <!-- Twitter / X -->

    <meta name="twitter:card" content="summary_large_image" />

    <meta name="twitter:title" content="OTPRILIKE. – Nemaš pojma? Nema veze." />

    <meta
      name="twitter:description"
      content="Sedam pitanja svaki dan. Testiraj svoj osjećaj za brojke!"
    />

    <meta
      name="twitter:image"
      content="https://otprilikehr.netlify.app/og-image-2.png"
    />

    <!-- Favicon -->

    <link rel="icon" type="image/svg+xml" href="<%= BASE_URL %>favicon.svg" />
  </head>

  <body>
    <noscript>
      Otprilike je besplatni dnevni kviz procjenjivanja na hrvatskom jeziku. Za
      igranje omogući JavaScript.
    </noscript>

    <div id="app"></div>
  </body>
</html>
